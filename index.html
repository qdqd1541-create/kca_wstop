<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>작업중지 요청서</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#E8E6DF;
    color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .sheet{
    max-width:480px;
    margin:0 auto;
    background:#fff;
    min-height:100vh;
    padding:14px 12px 100px;
  }
  table{
    width:100%;
    border-collapse:collapse;
  }
  td, th{
    border:1px solid #111;
    padding:6px 8px;
    font-size:12.5px;
    vertical-align:middle;
  }
  .doc-header td{padding:0;}
  .logo-cell{
    width:78px;
    text-align:center;
    font-weight:800;
    font-size:20px;
    letter-spacing:0.5px;
    padding:6px 0;
  }
  .logo-blue{color:#1F5FA6;}
  .logo-green{color:#2E8B57;}
  .logo-red{color:#C0392B;}
  .title-cell{
    text-align:center;
    font-weight:700;
    font-size:15px;
    padding:6px 4px;
  }
  .subtitle-row td{
    text-align:center;
    font-weight:700;
    font-size:14px;
    padding:6px 4px;
  }
  .meta-label{
    width:66px;
    background:#F2F1EC;
    text-align:center;
    font-size:11.5px;
    color:#333;
    padding:4px 2px;
  }
  .meta-value{
    font-size:11.5px;
    padding:4px 6px;
    white-space:nowrap;
  }
  .annex{
    font-size:12.5px;
    margin:10px 2px 8px;
    font-weight:700;
  }
  .form-box{
    border:1px solid #111;
    margin-top:4px;
  }
  .form-title{
    text-align:center;
    font-size:19px;
    font-weight:800;
    text-decoration:underline;
    text-underline-offset:4px;
    padding:16px 8px 14px;
  }
  .section-label{
    font-size:13px;
    font-weight:700;
    margin:14px 6px 6px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .section-label .sq{
    width:8px;height:8px;background:#111;display:inline-block;
  }
  .info-table{margin:0 6px;width:calc(100% - 12px);table-layout:fixed;}
  .info-table td{font-size:13px;word-break:keep-all;}
  .info-label{
    background:#F7F6F2;
    text-align:center;
    width:92px;
    font-weight:600;
    color:#222;
    white-space:nowrap;
  }
  .info-fixed{
    font-size:14px;
    padding:8px 10px;
  }
  .info-table input{
    width:100%;
    border:none;
    outline:none;
    font-size:14px;
    padding:6px 4px;
    font-family:inherit;
    background:transparent;
  }
  .content-box{
    border:1px solid #111;
    margin:0 6px 8px;
  }
  .content-row{
    border-bottom:1px solid #111;
    padding:10px 10px 12px;
  }
  .content-row:last-child{border-bottom:none;}
  .content-row .caption{
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
  }
  .content-row select{
    width:100%;
    border:1px solid #ccc;
    border-radius:5px;
    outline:none;
    font-family:inherit;
    font-size:14.5px;
    padding:9px 8px;
    background:#fff;
    color:#111;
  }
  .content-row textarea{
    width:100%;
    min-height:90px;
    border:none;
    outline:none;
    resize:vertical;
    font-family:inherit;
    font-size:14.5px;
    line-height:1.55;
    padding:2px;
  }
  .req{color:#C0392B;}
  .err{
    font-size:11.5px;
    color:#C0392B;
    margin-top:4px;
    display:none;
  }
  .err.show{display:block;}

  .settings-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 12px;
    margin:16px 6px 10px;
    background:#F7F6F2;
    border:1px dashed #999;
    border-radius:5px;
    font-size:12.5px;
    color:#333;
    cursor:pointer;
  }
  .settings-body{display:none;padding:2px 6px 10px;}
  .settings-body.open{display:block;}
  .settings-body label{
    display:block;
    font-size:11.5px;
    color:#555;
    margin:8px 0 4px;
  }
  .settings-body input{
    width:100%;
    border:1px solid #ccc;
    border-radius:5px;
    padding:8px 9px;
    font-size:14px;
    font-family:inherit;
  }
  .hint{
    font-size:11px;
    color:#777;
    margin:2px 8px 6px;
    line-height:1.5;
  }

  .actions{
    position:sticky;
    bottom:0;
    background:linear-gradient(180deg, rgba(255,255,255,0) 0%, #fff 35%);
    padding:12px 8px 10px;
    max-width:480px;
    margin:0 auto;
  }
  .btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:13px;
    border-radius:6px;
    font-size:14.5px;
    font-weight:700;
    border:none;
    margin-bottom:8px;
    cursor:pointer;
  }
  .btn-primary{background:#111;color:#fff;}
  .btn-secondary{background:#fff;color:#111;border:1px solid #bbb;}
  .btn:active{transform:scale(0.98);}
  .toast{
    position:fixed;
    left:50%;
    bottom:88px;
    transform:translateX(-50%);
    background:#111;
    color:#fff;
    padding:9px 16px;
    border-radius:20px;
    font-size:12.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s;
    white-space:nowrap;
    z-index:10;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="sheet">

  <div class="annex" style="margin-top:6px;">[붙임 2] 작업중지 요청서</div>

  <div class="form-box">
    <div class="form-title">작업중지 요청서</div>

    <div class="section-label"><span class="sq"></span>사업개요</div>
    <table class="info-table">
      <tr>
        <td class="info-label">사업자</td>
        <td class="info-fixed">한국방송통신전파진흥원</td>
      </tr>
      <tr>
        <td class="info-label">사업명</td>
        <td><input id="f_project" type="text" placeholder="사업명"></td>
      </tr>
      <tr>
        <td class="info-label">요청인<br>(소속)</td>
        <td><input id="f_requester" type="text" placeholder="예: 서울본부 이광성"></td>
      </tr>
      <tr>
        <td class="info-label">요청일시</td>
        <td><input id="f_datetime" type="datetime-local"></td>
      </tr>
    </table>

    <div class="section-label"><span class="sq"></span>작업중지 요청내용</div>
    <div class="content-box">
      <div class="content-row">
        <div class="caption">작업중지 요청 사유 : <span class="req">*</span></div>
        <select id="f_reason_select">
          <option value="우천으로 인한 무선국 검사 취소">우천으로 인한 무선국 검사 취소</option>
          <option value="말벌 및 곤충으로 인한 검사 불가능">말벌 및 곤충으로 인한 검사 불가능</option>
          <option value="안전위험으로 인한 검사 중지">안전위험으로 인한 검사 중지</option>
          <option value="__custom__">직접입력</option>
        </select>
        <textarea id="f_reason_custom" placeholder="사유를 직접 입력해 주세요" style="display:none; margin-top:8px;"></textarea>
        <div class="err" id="err_reason">요청 사유를 선택하거나 입력해 주세요.</div>
      </div>
      <div class="content-row">
        <div class="caption">작업중지 요청 내용 : <span class="req">*</span></div>
        <textarea id="f_content" placeholder="중지를 요청하는 작업 범위와 조치 요구사항을 적어주세요"></textarea>
        <div class="err" id="err_content">요청 내용을 입력해 주세요.</div>
      </div>
    </div>
  </div>

  <button class="settings-toggle" id="settingsToggle">
    <span>관리자 전송 정보 설정</span>
    <span id="settingsArrow">▾</span>
  </button>
  <div class="settings-body" id="settingsBody">
    <label>관리자 이메일</label>
    <input id="s_email" type="email" placeholder="manager@company.com">
    <label>작성자 이름 (본문에 표시)</label>
    <input id="s_name" type="text" placeholder="예: 홍길동 대리">
  </div>
  <p class="hint">한 번 입력하면 이 기기에 저장되어 다음에도 자동으로 불러옵니다.</p>

</div>

<div class="actions">
  <button class="btn btn-primary" id="btnSharePdf">PDF 만들어서 바로 전송</button>
  <button class="btn btn-secondary" id="btnPdf">PDF만 다운로드</button>
  <button class="btn btn-secondary" id="btnCopy">내용 복사하기</button>
</div>

<div id="pdfCapture" style="position:absolute; left:-9999px; top:0; width:700px; background:#fff; padding:32px; font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif; color:#111;">
  <p style="font-size:12px; margin:0 0 10px; font-weight:700;">[붙임 2] 작업중지 요청서</p>
  <div style="border:2px solid #000; padding:26px 24px 30px;">
    <h2 style="text-align:center; font-size:24px; font-weight:800; margin:0 0 26px; text-decoration:underline; text-underline-offset:5px;">작업중지 요청서</h2>

    <div style="font-size:14px; font-weight:700; margin:0 0 8px; display:flex; align-items:center; gap:6px;"><span style="width:8px;height:8px;background:#000;display:inline-block;"></span>사업개요</div>
    <table style="border-collapse:collapse; width:100%; margin-bottom:24px; table-layout:fixed;" border="2">
      <tr>
        <td style="background:#F2F1EC; width:15%; text-align:center; padding:12px 6px; font-size:13px;">사업자</td>
        <td style="width:35%; padding:12px 10px; font-size:14px;" id="pdf_owner"></td>
        <td style="background:#F2F1EC; width:15%; text-align:center; padding:12px 6px; font-size:13px;">사업명</td>
        <td style="width:35%; padding:12px 10px; font-size:14px;" id="pdf_project"></td>
      </tr>
      <tr>
        <td style="background:#F2F1EC; text-align:center; padding:12px 6px; font-size:13px;">요청인<br>(소속)</td>
        <td style="padding:12px 10px; font-size:14px;" id="pdf_requester"></td>
        <td style="background:#F2F1EC; text-align:center; padding:12px 6px; font-size:13px;">요청일시</td>
        <td style="padding:12px 10px; font-size:14px;" id="pdf_datetime"></td>
      </tr>
    </table>

    <div style="font-size:14px; font-weight:700; margin:0 0 8px; display:flex; align-items:center; gap:6px;"><span style="width:8px;height:8px;background:#000;display:inline-block;"></span>작업중지 요청내용</div>
    <table style="border-collapse:collapse; width:100%;" border="2">
      <tr><td style="padding:14px 12px 6px; font-size:14px;">작업중지 요청 사유 :</td></tr>
      <tr><td style="padding:0 12px 20px; font-size:14px; min-height:60px;" id="pdf_reason"></td></tr>
      <tr><td style="padding:14px 12px 6px; font-size:14px; border-top:2px solid #000;">작업중지 요청 내용 :</td></tr>
      <tr><td style="padding:0 12px 40px; font-size:14px; min-height:100px;" id="pdf_content"></td></tr>
    </table>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<div class="toast" id="toast"></div>

<script>
function pad(n){return String(n).padStart(2,'0');}
function nowLocalValue(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
document.getElementById('f_datetime').value = nowLocalValue();

const storageAdapter = {
  async get(key){
    if(window.storage){
      try{ return await window.storage.get(key); }catch(e){ return null; }
    }
    try{
      const v = localStorage.getItem(key);
      return v !== null ? { value: v } : null;
    }catch(e){ return null; }
  },
  async set(key, value){
    if(window.storage){
      try{ return await window.storage.set(key, value); }catch(e){ return null; }
    }
    try{ localStorage.setItem(key, value); return { value }; }catch(e){ return null; }
  }
};

const OWNER_FIXED = '한국방송통신전파진흥원';
const DEFAULTS = {
  project: '무선국검사',
  requester: '',
  email: 'lks1019@kca.kr'
};

async function loadSaved(){
  const r = await storageAdapter.get('kca_stop_form_defaults');
  if(r && r.value){
    try{
      const d = JSON.parse(r.value);
      document.getElementById('f_project').value = d.project || DEFAULTS.project;
      document.getElementById('f_requester').value = d.requester || DEFAULTS.requester;
      document.getElementById('s_email').value = d.email || DEFAULTS.email;
      document.getElementById('s_name').value = d.name || '';
      return;
    }catch(e){}
  }
  document.getElementById('f_project').value = DEFAULTS.project;
  document.getElementById('f_requester').value = DEFAULTS.requester;
  document.getElementById('s_email').value = DEFAULTS.email;
}
loadSaved();

async function saveDefaults(){
  const data = {
    project: document.getElementById('f_project').value,
    requester: document.getElementById('f_requester').value,
    email: document.getElementById('s_email').value,
    name: document.getElementById('s_name').value
  };
  await storageAdapter.set('kca_stop_form_defaults', JSON.stringify(data));
}
['f_project','f_requester','s_email','s_name'].forEach(id=>{
  document.getElementById(id).addEventListener('change', saveDefaults);
});

const reasonSelect = document.getElementById('f_reason_select');
const reasonCustom = document.getElementById('f_reason_custom');
reasonSelect.addEventListener('change', ()=>{
  reasonCustom.style.display = reasonSelect.value === '__custom__' ? 'block' : 'none';
  document.getElementById('err_reason').classList.remove('show');
});

document.getElementById('settingsToggle').addEventListener('click', ()=>{
  const body = document.getElementById('settingsBody');
  const arrow = document.getElementById('settingsArrow');
  body.classList.toggle('open');
  arrow.textContent = body.classList.contains('open') ? '▴' : '▾';
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function formatDatetime(v){
  if(!v) return '';
  const d = new Date(v);
  const days = ['일','월','화','수','목','금','토'];
  return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일('+days[d.getDay()]+') '+pad(d.getHours())+':'+pad(d.getMinutes());
}

function getReasonText(){
  if(reasonSelect.value === '__custom__') return reasonCustom.value.trim();
  return reasonSelect.value;
}

function validate(){
  let ok = true;
  const reason = getReasonText();
  const content = document.getElementById('f_content').value.trim();
  document.getElementById('err_reason').classList.toggle('show', !reason);
  document.getElementById('err_content').classList.toggle('show', !content);
  if(!reason || !content) ok = false;
  return ok;
}
document.getElementById('f_content').addEventListener('input', ()=>{
  document.getElementById('err_content').classList.remove('show');
});
reasonCustom.addEventListener('input', ()=>{
  document.getElementById('err_reason').classList.remove('show');
});

function buildText(){
  const owner = OWNER_FIXED;
  const project = document.getElementById('f_project').value.trim();
  const requester = document.getElementById('f_requester').value.trim();
  const dt = formatDatetime(document.getElementById('f_datetime').value);
  const reason = getReasonText();
  const content = document.getElementById('f_content').value.trim();
  const name = document.getElementById('s_name').value.trim();

  let body = '작업중지 요청서\n';
  body += 'KCA-SHG-29 안전보건경영지침서 [붙임 2]\n';
  body += '=======================\n\n';
  body += '■ 사업개요\n';
  body += '사업자      : '+owner+'\n';
  body += '사업명      : '+project+'\n';
  body += '요청인(소속) : '+requester+'\n';
  body += '요청일시    : '+dt+'\n\n';
  body += '■ 작업중지 요청내용\n\n';
  body += '작업중지 요청 사유 :\n'+reason+'\n\n';
  body += '작업중지 요청 내용 :\n'+content+'\n';
  if(name){ body += '\n요청인: '+name+'\n'; }
  return body;
}

function fillPdfCapture(){
  document.getElementById('pdf_owner').textContent = OWNER_FIXED;
  document.getElementById('pdf_project').textContent = document.getElementById('f_project').value.trim();
  document.getElementById('pdf_requester').textContent = document.getElementById('f_requester').value.trim();
  document.getElementById('pdf_datetime').textContent = formatDatetime(document.getElementById('f_datetime').value);
  document.getElementById('pdf_reason').textContent = getReasonText();
  document.getElementById('pdf_content').textContent = document.getElementById('f_content').value.trim();
}

async function buildPdfBlob(){
  fillPdfCapture();
  const canvas = await html2canvas(document.getElementById('pdfCapture'), { scale: 2, backgroundColor: '#ffffff' });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'pt', 'a4');
  const pageWidth = pdf.internal.pageSize.getWidth();
  const margin = 28;
  const imgWidth = pageWidth - margin * 2;
  const imgHeight = imgWidth * (canvas.height / canvas.width);
  const imgData = canvas.toDataURL('image/png');
  pdf.addImage(imgData, 'PNG', margin, margin, imgWidth, imgHeight);
  const project = document.getElementById('f_project').value.trim() || '무선국검사';
  const fname = '작업중지요청서_'+project+'_'+document.getElementById('f_datetime').value.slice(0,10)+'.pdf';
  return { blob: pdf.output('blob'), fname };
}

document.getElementById('btnPdf').addEventListener('click', async ()=>{
  if(!validate()){ showToast('필수 항목을 입력해 주세요'); return; }
  showToast('PDF 만드는 중...');
  try{
    const { blob, fname } = await buildPdfBlob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    showToast('PDF 다운로드됨');
  }catch(e){
    showToast('PDF 생성에 실패했어요');
  }
});

document.getElementById('btnSharePdf').addEventListener('click', async ()=>{
  if(!validate()){ showToast('필수 항목을 입력해 주세요'); return; }
  showToast('PDF 만드는 중...');
  let blob, fname;
  try{
    const result = await buildPdfBlob();
    blob = result.blob; fname = result.fname;
  }catch(e){
    showToast('PDF 생성에 실패했어요');
    return;
  }
  const file = new File([blob], fname, { type: 'application/pdf' });
  const shareText = buildText();

  if(navigator.canShare && navigator.canShare({ files: [file] })){
    try{
      await navigator.share({ files: [file], title: '작업중지 요청서', text: shareText });
      showToast('전송 완료');
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return;
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);

  const email = document.getElementById('s_email').value.trim();
  const project = document.getElementById('f_project').value.trim();
  const subject = '[작업중지 요청서] '+project+' - '+document.getElementById('f_datetime').value.slice(0,10);
  const mailto = 'mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(shareText);
  showToast('이 기기는 파일 공유를 지원하지 않아 PDF를 다운로드했어요. 메일에 직접 첨부해 주세요');
  setTimeout(()=>{ window.location.href = mailto; }, 1200);
});

document.getElementById('btnCopy').addEventListener('click', async ()=>{
  if(!validate()){ showToast('필수 항목을 입력해 주세요'); return; }
  const text = buildText();
  try{
    await navigator.clipboard.writeText(text);
    showToast('복사되었습니다');
  }catch(e){
    showToast('복사에 실패했어요');
  }
});
</script>
</body>
</html>
